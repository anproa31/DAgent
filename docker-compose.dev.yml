name: daa

services:
  data-analysis-agent-db:
    image: postgres:15-alpine
    container_name: db_service
    env_file:
      - .dbsetting
    networks:
      - app_network
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d main_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  data-analysis-agent-sandbox:
    build: ./sandbox
    container_name: sandbox_service
    networks:
      - app_network
    env_file:
      - .dbsetting
    depends_on:
      data-analysis-agent-db:
        condition: service_healthy

    command: uvicorn main:app --host 0.0.0.0 --port 8001

  data-analysis-agent-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app_service
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .dbsetting
    ports:
      - "8073:8000"
    environment:
      CODE_RUNNER_URL: http://data-analysis-agent-sandbox:8001/
    networks:
      - app_network
    depends_on:
      - data-analysis-agent-sandbox
      - data-analysis-agent-db
    volumes:
      - ./app/src:/usr/src/app/src

  data-analysis-agent-agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: agent_service
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8074:8000"
    env_file:
      - .dbsetting
    environment:
      CODE_RUNNER_URL: http://data-analysis-agent-sandbox:8001/
      APP_SERVICE_URL: http://data-analysis-agent-app:8000
    networks:
      - app_network
    depends_on:
      - data-analysis-agent-app
      - data-analysis-agent-sandbox
      - data-analysis-agent-db
    volumes:
      - ./agent-service:/usr/src/app

  data-analysis-agent-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    stdin_open: true
    tty: true
    ports:
      - 3030:5173
    command: /bin/sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - node-modules:/app/node_modules/
    environment:
      - VITE_SERVER_URL=http://localhost:8073
      - VITE_AGENT_SERVICE_URL=http://localhost:8074

networks:
  app_network:
    driver: bridge

volumes:
  node-modules: