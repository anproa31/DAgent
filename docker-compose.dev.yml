name: daa-dev

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: daa_dev_qdrant
    ports:
      - "6333:6333"
    networks:
      - app_network
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: daa_dev_redis
    ports:
      - "6379:6379"
    networks:
      - app_network

  postgres:
    image: postgres:16-alpine
    container_name: daa_dev_postgres
    environment:
      POSTGRES_USER: daa
      POSTGRES_PASSWORD: daa
      POSTGRES_DB: daa_agent
    ports:
      - "5433:5432"
    volumes:
      - agent_pg_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daa -d daa_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  sandbox:
    build: ./sandbox
    container_name: daa_dev_sandbox
    networks:
      - app_network
    environment:
      APP_SERVICE_URL: ${APP_SERVICE_URL:-http://app:8000}
      SANDBOX_DUCKDB_PATH: /data/sandbox.duckdb
    volumes:
      - datasource_data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: daa_dev_app
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8173:8000"
    environment:
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://sandbox:8001/}
      DATASOURCE_ROOT: /data/datasources
      DCE_DOMAIN_DIR: ${DCE_DOMAIN_DIR:-/data/datasources/dce_domain}
      DCE_OLLAMA_HOST: ${DCE_OLLAMA_HOST:-host.docker.internal}
      DCE_OLLAMA_PORT: ${DCE_OLLAMA_PORT:-11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
    networks:
      - app_network
    depends_on:
      - sandbox
    volumes:
      - ./app/src:/usr/src/app/src
      - datasource_data:/data
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: daa_dev_agent
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8174:8000"
    environment:
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://sandbox:8001/}
      APP_SERVICE_URL: ${APP_SERVICE_URL:-http://app:8000}
      DATASOURCE_ROOT: /data/datasources
      DCE_DOMAIN_DIR: ${DCE_DOMAIN_DIR:-/data/datasources/dce_domain}
      DCE_OLLAMA_HOST: ${DCE_OLLAMA_HOST:-host.docker.internal}
      DCE_OLLAMA_PORT: ${DCE_OLLAMA_PORT:-11434}
      # Chat/run persistence in Postgres (schema auto-created on boot; alembic for versioned migrations)
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://daa:daa@postgres:5432/daa_agent}
      # Set SQL_ECHO=1 to log SQL while debugging
      SQL_ECHO: "0"
      # Memory system (memory.md)
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Embedding endpoint default; the user overrides it from the Settings UI per request.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      MEMORY_USER_ID: ${MEMORY_USER_ID:-default}
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
      sandbox:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./agent-service:/usr/src/app
      - datasource_data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    stdin_open: true
    tty: true
    ports:
      - "3130:5173"
    command: /bin/sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - ./sample_dataset:/sample_dataset
      - node-modules:/app/node_modules/
    environment:
      - VITE_SERVER_URL=http://localhost:8173
      - VITE_AGENT_SERVICE_URL=http://localhost:8174
      # Default LLM base URL when localStorage is empty; host.docker.internal reaches Ollama on the host from the app container when using this stack.
      - VITE_DEFAULT_OPENAI_BASE_URL=http://host.docker.internal:11434

networks:
  app_network:
    driver: bridge

volumes:
  node-modules:
    name: node_modules
  datasource_data:
    name: dev_datasource_data
  qdrant_data:
    name: dev_qdrant_data
  agent_pg_data:
    name: dev_agent_pg_data
