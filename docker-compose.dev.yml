name: daa-dev

services:
  context-engine:
    build: ./context-engine
    container_name: daa_dev_context_engine
    ports:
      - "8172:8002"
    networks:
      - app_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: daa_dev_qdrant
    ports:
      - "6333:6333"
    networks:
      - app_network
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: daa_dev_redis
    ports:
      - "6379:6379"
    networks:
      - app_network

  sandbox:
    build: ./sandbox
    container_name: daa_dev_sandbox
    networks:
      - app_network
    environment:
      APP_SERVICE_URL: ${APP_SERVICE_URL:-http://app:8000}
      SANDBOX_DUCKDB_PATH: /data/sandbox.duckdb
    volumes:
      - datasource_data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: daa_dev_app
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8173:8000"
    environment:
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://sandbox:8001/}
      DATASOURCE_ROOT: /data/datasources
      CONTEXT_ENGINE_URL: ${CONTEXT_ENGINE_URL:-http://context-engine:8002/}
    networks:
      - app_network
    depends_on:
      - sandbox
      - context-engine
    volumes:
      - ./app/src:/usr/src/app/src
      - datasource_data:/data
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: daa_dev_agent
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8174:8000"
    environment:
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://sandbox:8001/}
      APP_SERVICE_URL: ${APP_SERVICE_URL:-http://app:8000}
      CONTEXT_ENGINE_URL: ${CONTEXT_ENGINE_URL:-http://context-engine:8002/}
      # Chat session DB on host (gitignored); run `alembic upgrade head` from ./agent-service
      DATABASE_URL: sqlite+aiosqlite:////usr/src/app/data/agent.db
      # Set SQL_ECHO=1 to log SQL while debugging
      SQL_ECHO: "0"
      # Memory system (memory.md)
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Embedding endpoint default; the user overrides it from the Settings UI per request.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      MEMORY_USER_ID: ${MEMORY_USER_ID:-default}
    networks:
      - app_network
    depends_on:
      - app
      - sandbox
      - context-engine
      - qdrant
      - redis
    volumes:
      - ./agent-service:/usr/src/app
      # Persist SQLite outside the image; visible at ./agent-service/data on the host for testing
      - ./agent-service/data:/usr/src/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    stdin_open: true
    tty: true
    ports:
      - "3130:5173"
    command: /bin/sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - ./sample_dataset:/sample_dataset
      - node-modules:/app/node_modules/
    environment:
      - VITE_SERVER_URL=http://localhost:8173
      - VITE_AGENT_SERVICE_URL=http://localhost:8174
      # Default LLM base URL when localStorage is empty; host.docker.internal reaches Ollama on the host from the app container when using this stack.
      - VITE_DEFAULT_OPENAI_BASE_URL=http://host.docker.internal:11434

networks:
  app_network:
    driver: bridge

volumes:
  node-modules:
    name: node_modules
  datasource_data:
    name: dev_datasource_data
  qdrant_data:
    name: dev_qdrant_data
