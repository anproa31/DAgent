name: daa

services:
  sandbox:
    build: ./sandbox
    container_name: sandbox_service
    networks:
      - app_network
    environment:
      APP_SERVICE_URL: http://app:8000
      SANDBOX_DUCKDB_PATH: /data/sandbox.duckdb
    volumes:
      - datasource_data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app_service
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8073:8000"
    environment:
      CODE_RUNNER_URL: http://sandbox:8001/
      DATASOURCE_ROOT: /data/datasources
    networks:
      - app_network
    depends_on:
      - sandbox
    volumes:
      - ./app/src:/usr/src/app/src
      - datasource_data:/data
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: agent_service
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8074:8000"
    environment:
      CODE_RUNNER_URL: http://sandbox:8001/
      APP_SERVICE_URL: http://app:8000
    networks:
      - app_network
    depends_on:
      - app
      - sandbox
    volumes:
      - ./agent-service:/usr/src/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    stdin_open: true
    tty: true
    ports:
      - 3030:5173
    command: /bin/sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - node-modules:/app/node_modules/
    environment:
      - VITE_SERVER_URL=http://localhost:8073
      - VITE_AGENT_SERVICE_URL=http://localhost:8074

networks:
  app_network:
    driver: bridge

volumes:
  node-modules:
  datasource_data:
