name: daa-prod

services:
  context-engine:
    build: ./context-engine
    container_name: daa_prod_context_engine
    networks:
      - app_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: daa_prod_qdrant
    networks:
      - app_network
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: daa_prod_redis
    networks:
      - app_network

  postgres:
    image: postgres:16-alpine
    container_name: daa_prod_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daa}
      POSTGRES_DB: ${POSTGRES_DB:-daa_agent}
    volumes:
      - agent_pg_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daa} -d ${POSTGRES_DB:-daa_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sandbox:
    build: ./sandbox
    container_name: daa_prod_sandbox
    networks:
      - app_network
    environment:
      # Same service keys as docker-compose.dev.yml — URLs match .env.example defaults.
      APP_SERVICE_URL: ${APP_SERVICE_URL:-http://app:8000}
      SANDBOX_DUCKDB_PATH: /data/sandbox.duckdb
    volumes:
      - datasource_data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: daa_prod_app
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8073:8000"
    environment:
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://sandbox:8001/}
      DATASOURCE_ROOT: /data/datasources
      CONTEXT_ENGINE_URL: ${CONTEXT_ENGINE_URL:-http://context-engine:8002/}
    networks:
      - app_network
    depends_on:
      - sandbox
      - context-engine
    volumes:
      - ./app/src:/usr/src/app/src
      - datasource_data:/data

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: daa_prod_agent
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8074:8000"
    environment:
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://sandbox:8001/}
      APP_SERVICE_URL: ${APP_SERVICE_URL:-http://app:8000}
      CONTEXT_ENGINE_URL: ${CONTEXT_ENGINE_URL:-http://context-engine:8002/}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      MEMORY_USER_ID: ${MEMORY_USER_ID:-default}
      # Chat/run persistence in Postgres (schema auto-created on boot; alembic for versioned migrations)
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://daa:daa@postgres:5432/daa_agent}
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
      sandbox:
        condition: service_started
      context-engine:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_SERVER_URL=http://localhost:8073
        - VITE_AGENT_SERVICE_URL=http://localhost:8074
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - ./sample_dataset:/sample_dataset
    environment:
      - NODE_ENV=production

networks:
  app_network:
    driver: bridge

volumes:
  # Shared volume used by both ``app`` (registry + uploads) and ``sandbox`` (DuckDB).
  datasource_data:
    name: prod_datasource_data
  # Postgres data for agent chat/run session history.
  agent_pg_data:
    name: prod_agent_pg_data
  # Qdrant vector store for the memory system (semantic / episodic / procedural).
  qdrant_data:
    name: prod_qdrant_data
