name: daa

services:
  db:
    image: postgres:15-alpine
    container_name: db_service
    env_file:
      - .dbsetting
    networks:
      - app_network
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d main_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  data-analysis-agent-sandbox:
    build: ./sandbox
    container_name: sandbox_service
    env_file:
      - .dbsetting
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy

    command: uvicorn main:app --host 0.0.0.0 --port 8001

  app:
    build:
      context: ./app # Build context is the app directory
      dockerfile: Dockerfile
    container_name: app_service
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8073:8000"
    env_file:
      - .dbsetting
    environment:
      CODE_RUNNER_URL: http://sandbox:8001/
    networks:
      - app_network
    depends_on:
      - sandbox
      - db
    volumes:
      - ./app/src:/usr/src/app/src

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: agent_service
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8074:8000"
    env_file:
      - .dbsetting
    environment:
      CODE_RUNNER_URL: http://sandbox:8001/
      APP_SERVICE_URL: http://app:8000
    networks:
      - app_network
    depends_on:
      - app
      - sandbox
      - db

  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_SERVER_URL=http://localhost:8073
        - VITE_AGENT_SERVICE_URL=http://localhost:8074
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      - NODE_ENV=production
      
networks:
  app_network:
    driver: bridge