name: daa

services:
  data-analysis-agent-sandbox:
    build: ./sandbox
    container_name: sandbox_service
    networks:
      - app_network
    environment:
      # The sandbox bootstraps datasources from the app on startup.
      APP_SERVICE_URL: http://data-analysis-agent-app:8000
      # DuckDB database file lives on the shared volume so it survives container restarts.
      SANDBOX_DUCKDB_PATH: /data/sandbox.duckdb
    volumes:
      - datasource_data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  data-analysis-agent-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app_service
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8073:8000"
    environment:
      CODE_RUNNER_URL: http://data-analysis-agent-sandbox:8001/
      # Datasource registry storage (uploaded files + registry.json).
      DATASOURCE_ROOT: /data/datasources
    networks:
      - app_network
    depends_on:
      - data-analysis-agent-sandbox
    volumes:
      - ./app/src:/usr/src/app/src
      - datasource_data:/data

  data-analysis-agent-agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: agent_service
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8074:8000"
    environment:
      CODE_RUNNER_URL: http://data-analysis-agent-sandbox:8001/
      APP_SERVICE_URL: http://data-analysis-agent-app:8000
    networks:
      - app_network
    depends_on:
      - data-analysis-agent-app
      - data-analysis-agent-sandbox

  data-analysis-agent-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_SERVER_URL=http://localhost:8073
        - VITE_AGENT_SERVICE_URL=http://localhost:8074
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      - NODE_ENV=production

networks:
  app_network:
    driver: bridge

volumes:
  # Shared volume used by both ``app`` (registry + uploaded files) and the
  # ``sandbox`` (DuckDB database file).
  datasource_data:
