name: daa-prod

services:
  sandbox:
    build: ./sandbox
    container_name: daa_prod_sandbox
    networks:
      - app_network
    environment:
      # Same service keys as docker-compose.dev.yml — URLs match .env.example defaults.
      APP_SERVICE_URL: ${APP_SERVICE_URL:-http://app:8000}
      SANDBOX_DUCKDB_PATH: /data/sandbox.duckdb
    volumes:
      - datasource_data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: daa_prod_app
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8073:8000"
    environment:
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://sandbox:8001/}
      DATASOURCE_ROOT: /data/datasources
    networks:
      - app_network
    depends_on:
      - sandbox
    volumes:
      - ./app/src:/usr/src/app/src
      - datasource_data:/data

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: daa_prod_agent
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8074:8000"
    environment:
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://sandbox:8001/}
      APP_SERVICE_URL: ${APP_SERVICE_URL:-http://app:8000}
    volumes:
      - agent_service_data:/usr/src/app/data
    networks:
      - app_network
    depends_on:
      - app
      - sandbox

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_SERVER_URL=http://localhost:8073
        - VITE_AGENT_SERVICE_URL=http://localhost:8074
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      - NODE_ENV=production

networks:
  app_network:
    driver: bridge

volumes:
  # Shared volume used by both ``app`` (registry + uploads) and ``sandbox`` (DuckDB).
  datasource_data:
    name: prod_datasource_data
  # SQLite DB for agent chat session history.
  agent_service_data:
    name: prod_agent_data
