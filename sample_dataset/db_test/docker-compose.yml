# Standalone demo PostgreSQL for testing "Connect database" in the app.
#
# Start:
#   docker compose -f sample_dataset/db_test/docker-compose.yml up -d
#
# Stop (keeps data volume):
#   docker compose -f sample_dataset/db_test/docker-compose.yml down
#
# Reset data:
#   docker compose -f sample_dataset/db_test/docker-compose.yml down -v

name: daa-demo-db

services:
  demo-postgres:
    image: postgres:16-alpine
    container_name: demo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: hr_analytics
    ports:
      # Host port 5433 avoids clashing with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - ../csv:/sample_data:ro
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d hr_analytics"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  demo_pgdata:
